<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify your email - Player Fund Inc</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="portal.css">
</head>
<body>

<header class="site-nav">
  <div class="wrap">
    <a class="brand" href="../index.html"><img class="brand-logo" src="../assets/logo.svg" alt="Player Fund Inc"></a>
    <button type="button" class="btn btn-ghost" id="sign-out"><span>Sign out</span></button>
  </div>
</header>

<main id="main" class="portal-main">
  <div class="wrap portal-wrap">
    <div class="portal-card">
      <h1>Check your email</h1>
      <p class="lede" id="sent-note">Sending a sign-in code...</p>

      <form id="verify-form" autocomplete="off" novalidate>
        <div class="field">
          <input type="text" id="code" name="code" placeholder=" " inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required spellcheck="false" class="otp-input">
          <label for="code">Six-digit code</label>
        </div>
        <div>
          <button class="btn btn-primary" type="submit" id="verify-btn"><span>Verify and continue</span></button>
        </div>
        <p class="form-note" id="verify-status" role="status" aria-live="polite"></p>
      </form>

      <button type="button" class="text-link text-link-button" id="resend-btn">Send a new code</button>
    </div>
  </div>
</main>

<script type="module" src="admin-verify.js"></script>
</body>
</html>
