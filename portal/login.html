<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Investor Relations Login - Player Fund Inc</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="preload" href="../assets/fonts/schibsted-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="portal.css">
</head>
<body>

<header class="site-nav">
  <div class="wrap">
    <a class="brand" href="../index.html"><img class="brand-logo" src="../assets/logo.png" alt="Player Fund Inc"></a>
  </div>
</header>

<main id="main" class="portal-main">
  <div class="wrap portal-wrap">
    <div class="portal-card">
      <h1 id="portal-title">Sign in</h1>
      <p class="lede">Access your documents and account information.</p>

      <form id="auth-form" method="post" action="." novalidate>
        <div class="field">
          <input type="email" id="email" name="email" placeholder=" " required autocomplete="email">
          <label for="email">Email</label>
        </div>
        <div class="field">
          <input type="password" id="password" name="password" placeholder=" " required autocomplete="current-password" minlength="6">
          <label for="password">Password</label>
        </div>
        <div>
          <button class="btn btn-primary" type="submit" id="submit-btn" disabled><span>Sign in</span></button>
        </div>
        <p class="form-note" id="form-status" role="status"></p>
      </form>

      <p class="portal-links">
        <a class="text-link" href="forgot.html">Forgot your password?</a>
        <a class="text-link" href="signup.html">Need an account? Sign up</a>
      </p>
    </div>
  </div>
</main>

<script src="button-fallback.js"></script>
<script type="module" src="portal-auth.js"></script>
</body>
</html>
