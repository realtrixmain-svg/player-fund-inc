<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client Portal Login - Player Fund Inc</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,500&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="portal.css">
</head>
<body>

<header class="site-nav">
  <div class="wrap">
    <a class="brand" href="../index.html"><img class="brand-logo" src="../assets/logo.svg" alt="Player Fund Inc"></a>
  </div>
</header>

<main id="main" class="portal-main">
  <div class="wrap portal-wrap">
    <div class="portal-card">
      <h1 id="portal-title">Sign in</h1>
      <p class="lede">Access your documents and account information.</p>

      <form id="auth-form" novalidate>
        <div class="field">
          <input type="email" id="email" name="email" placeholder=" " required autocomplete="email">
          <label for="email">Email</label>
        </div>
        <div class="field">
          <input type="password" id="password" name="password" placeholder=" " required autocomplete="current-password" minlength="6">
          <label for="password">Password</label>
        </div>
        <div>
          <button class="btn btn-primary" type="submit" id="submit-btn"><span>Sign in</span></button>
        </div>
        <p class="form-note" id="form-status" role="status"></p>
      </form>

      <a class="text-link" href="signup.html">Need an account? Sign up</a>
    </div>
  </div>
</main>

<script type="module" src="portal-auth.js"></script>
</body>
</html>
