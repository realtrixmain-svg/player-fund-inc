<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset your password - Player Fund Inc</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="portal.css">
</head>
<body>

<header class="site-nav">
  <div class="wrap">
    <a class="brand" href="../index.html"><img class="brand-logo" src="../assets/logo.png" alt="Player Fund Inc"></a>
  </div>
</header>

<main id="main" class="portal-main">
  <div class="wrap portal-wrap">
    <div class="portal-card">
      <h1>Reset your password</h1>
      <p class="lede">Enter the email address on your account and we will send you a link to set a new password.</p>

      <form id="auth-form" method="post" action="." novalidate>
        <div class="field">
          <input type="email" id="email" name="email" placeholder=" " required autocomplete="email">
          <label for="email">Email</label>
        </div>
        <div>
          <button class="btn btn-primary" type="submit" id="submit-btn" disabled><span>Send reset link</span></button>
        </div>
        <p class="form-note" id="form-status" role="status"></p>
      </form>

      <a class="text-link" href="login.html">Back to sign in</a>
    </div>
  </div>
</main>

<script src="button-fallback.js"></script>
<script type="module" src="forgot.js"></script>
</body>
</html>
