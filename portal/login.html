<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client Portal Login - Player Fund Inc</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,500&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="portal.css">
</head>
<body>

<header class="site-nav">
  <div class="wrap">
    <a class="brand" href="../index.html">
      <svg viewBox="0 0 40 30" aria-hidden="true">
        <rect x="0" y="14" width="7" height="16" fill="#8fa3b6"/>
        <rect x="10" y="7" width="7" height="23" fill="#6f89a0"/>
        <rect x="20" y="16" width="7" height="14" fill="#a6915f"/>
        <rect x="30" y="0" width="7" height="30" fill="#4d6584"/>
      </svg>
      <span class="brand-text">
        <span class="brand-name">Player</span>
        <span class="brand-sub">FUND INC</span>
      </span>
    </a>
  </div>
</header>

<main id="main" class="portal-main">
  <div class="wrap portal-wrap">
    <div class="portal-card">
      <h1 id="portal-title">Sign in</h1>
      <p class="lede">Access your documents and account information.</p>

      <form id="auth-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" minlength="6">
        </div>
        <div>
          <button class="btn btn-primary" type="submit" id="submit-btn"><span>Sign in</span></button>
        </div>
        <p class="form-note" id="form-status" role="status"></p>
      </form>

      <button type="button" class="text-link" id="toggle-mode">Need an account? Sign up</button>
    </div>
  </div>
</main>

<script type="module" src="portal-auth.js"></script>
</body>
</html>
